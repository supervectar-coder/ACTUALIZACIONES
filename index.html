<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUPERVECTAR TV ACTUALIZACIONES</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:white;
    color:#111;
    padding:20px;
}

h1{
    color:red;
    text-align:center;
}

.lista{
    background:#f2f2f2;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    border:1px solid #ddd;
}

.nombre{
    color:#222;
    font-size:18px;
    margin-bottom:10px;
}

a{
    color:#0066cc;
    text-decoration:none;
    word-break:break-all;
}

a:hover{
    text-decoration:underline;
}

.botones{
    margin-top:12px;
}

button{
    background:#444;
    color:white;
    border:none;
    padding:10px;
    margin:5px 5px 0 0;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#666;
}

.estado{
    margin-top:20px;
    color:#444;
    text-align:center;
}

</style>
</head>

<body>

<h1 style="display:flex; align-items:center; justify-content:center; gap:10px;">
    <img src="https://i.ibb.co/7dGjZb80/6.jpg" alt="Logo" style="height:40px;">
    SUPERVECTAR TV ACTUALIZACIONES
</h1>

<div id="notice">
  ⚠️ SI ENTRAS DESDE ANDROID TV UTILIZA UN RATON DE ORDENADOR O LA FUNCION RATON DEL MANDO A DISTANCIA.

</div>

<div id="notice">
  ⚠️ DESCARGA Y ACTUALIZA TU VERSION SUPERVECTAR TV SI FUERA NECESARIO.

</div>

<div id="listas"></div>

<div class="estado" id="estado">
Cargando listas IPTV...
</div>

<script>

const listas = [

    
    {
        nombre: "ACTUALIZACION SUPERVECTAR TV v2.0",
        url: "https://drive.google.com/file/d/1A0vkq4UXvkTo00TVDm407JhFf75Ok4aN/view"
    }

];

function cargarListas(){

    const contenedor =
        document.getElementById("listas");

    const estado =
        document.getElementById("estado");

    contenedor.innerHTML = "";

    listas.forEach((lista, index) => {

        const div = document.createElement("div");

        div.className = "lista";

        div.innerHTML = `

            <div class="nombre">
                ${index + 1}. ${lista.nombre}
            </div>

            <a href="${lista.url}" target="_blank">
                ${lista.url}
            </a>

            <div class="botones">

                ${
                    index === 0
                    ? `
                        <button onclick="abrir('${lista.url}')">
                            ⬇ DESCARGAR
                        </button>
                      `
                    : `
                        <button onclick="abrir('${lista.url}')">
                            ⬇ DESCARGAR
                        </button>
                      `
                }

            </div>
        `;

        contenedor.appendChild(div);
    });

    estado.innerHTML =
        `✅ ${listas.length} Actualizacion disponible.`;
}

function abrir(url){
    window.open(url, "_blank");
}

async function copiar(url){

    try{
        await navigator.clipboard.writeText(url);
        alert("URL copiada correctamente");
    }catch{
        alert("No se pudo copiar");
    }
}

cargarListas();

</script>

</body>
</html>
